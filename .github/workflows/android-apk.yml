name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  native-checks:
    uses: ./.github/workflows/wallet-native-check.yml
  sdk-checks:
    uses: ./.github/workflows/wallet-sdk-verify.yml
  build:
    needs: [native-checks, sdk-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run server safety tests
        run: npm test

      - name: Synchronize mobile project
        run: npm run mobile:sync

      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing one or more Android signing secrets. Read ANDROID-SIGNING.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jamddmaj-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          JAMDDMAJ_KEYSTORE_FILE: jamddmaj-release.jks
          JAMDDMAJ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JAMDDMAJ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAMDDMAJ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew assembleRelease

      - name: Verify main-app identity and permanent signature
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk JamdDmaj-AI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs JamdDmaj-AI.apk > signature.txt
          grep -qi 'd4799319516f9b243b12ef4678823baed39d9203e42fa70f8de0ba0f7c0080d6' signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging JamdDmaj-AI.apk | grep "package: name='com.jamddmaj.ai'"
          sha256sum JamdDmaj-AI.apk > SHA256SUMS.txt

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/jamddmaj-release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JamdDmaj-AI-APK
          path: |
            JamdDmaj-AI.apk
            SHA256SUMS.txt
            signature.txt
          if-no-files-found: error
