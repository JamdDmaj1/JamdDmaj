name: Android launcher regression check
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-launch-smoke.yml'
      - 'scripts/check-published-android-launch.sh'
      - 'android/app/src/main/java/com/jamddmaj/ai/AccountSessionPlugin.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/MainActivity.java'
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build isolated candidate with production launcher code
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npm ci
          npm run mobile:sync
          bash android/gradlew -p android :app:assembleWalletPreview --stacktrace
          cp android/app/build/outputs/apk/walletPreview/app-walletPreview.apk "$RUNNER_TEMP/app.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/check-published-android-launch.sh
        env:
          SMOKE_PACKAGE: com.jamddmaj.ai.walletpreview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-${{ matrix.api }}
          path: launch-evidence/
          retention-days: 7
