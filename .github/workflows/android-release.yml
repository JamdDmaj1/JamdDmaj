name: Publish Signed Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install and synchronize
        run: |
          npm ci
          npm test
          npm run mobile:sync

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jamddmaj-release.jks

      - name: Build signed release
        working-directory: android
        env:
          JAMDDMAJ_KEYSTORE_FILE: jamddmaj-release.jks
          JAMDDMAJ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JAMDDMAJ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAMDDMAJ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../JamdDmaj-AI.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "JamdDmaj AI $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" JamdDmaj-AI.apk --clobber
