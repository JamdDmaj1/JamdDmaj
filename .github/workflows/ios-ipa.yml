name: Build Native iPhone IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize native iPhone project
        run: npm run mobile:sync

      - name: Build native iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/Payload/JamdDmajAI.app
          cd build
          zip -r JamdDmaj-AI-unsigned.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: JamdDmaj-AI-iPhone-unsigned
          path: build/JamdDmaj-AI-unsigned.ipa
          if-no-files-found: error

