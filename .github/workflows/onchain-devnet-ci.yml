# Builds and local VM tests only. No real wallet keys or network transactions.
name: Fair Launch on-chain safety

on:
  workflow_dispatch:
  push:
    paths:
      - "onchain/**"
      - "integration/**"
      - "lib/fair-launch-devnet-verifier.js"
      - "lib/fair-launch-eligibility.js"
      - "lib/fair-launch-lock-model.js"
      - "tests/fair-launch-onchain.test.mjs"
      - ".github/workflows/onchain-devnet-ci.yml"
      - ".github/workflows/deploy-fair-launch-devnet.yml"
  pull_request:
    paths:
      - "onchain/**"
      - "integration/**"
      - "lib/fair-launch-devnet-verifier.js"
      - "lib/fair-launch-eligibility.js"
      - "lib/fair-launch-lock-model.js"
      - "tests/fair-launch-onchain.test.mjs"
      - ".github/workflows/onchain-devnet-ci.yml"
      - ".github/workflows/deploy-fair-launch-devnet.yml"

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - name: Compile and test policy logic
        run: cargo test --locked --manifest-path onchain/Cargo.toml --workspace

  sbf-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Solana toolchain
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
      - name: Build deployable sBPF artifact without deploying
        env:
          PATH: /home/runner/.local/share/solana/install/active_release/bin:/home/runner/.local/share/agave/install/active_release/bin:/home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build-sbf --manifest-path onchain/programs/jamddmaj-lock/Cargo.toml -- --locked 2>&1 | tee sbf-build.log; then
            {
              echo "### sBPF diagnostic (no deployment attempted)"
              echo '```text'
              tail -n 80 sbf-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic="$(tail -n 30 sbf-build.log | tr '\n' '|' | sed 's/%/%25/g; s/|/%0A/g')"
            echo "::error title=sBPF build diagnostic::$diagnostic"
            exit 1
          fi
      - name: Record artifact hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          sha256sum onchain/target/deploy/jamddmaj_lock.so | tee verification/jamddmaj_lock.so.sha256
          sha256sum onchain/Cargo.lock | tee verification/Cargo.lock.sha256
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "solana=$(solana --version)"
            echo "cargo_build_sbf=$(cargo build-sbf --version 2>/dev/null || true)"
          } | tee verification/toolchain.txt
          cp sbf-build.log verification/sbf-build.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated integration dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix integration
      - name: Test Squads approvals, timelock and category vesting in local VM
        shell: bash
        run: |
          set -euo pipefail
          node integration/squads-vesting.mjs | tee verification/squads-vesting.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jamddmaj-lock-verification-${{ github.sha }}
          path: |
            onchain/target/deploy/jamddmaj_lock.so
            onchain/Cargo.lock
            verification/
          if-no-files-found: error
          retention-days: 90
