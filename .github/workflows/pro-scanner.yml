name: JamdDmaj Pro Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

concurrency:
  group: jamddmaj-pro-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run private server scanner
        env:
          CRON_SECRET: ${{ secrets.JAMDDMAJ_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing JAMDDMAJ_CRON_SECRET GitHub secret"
            exit 1
          fi
          response=$(curl --fail-with-body --retry 2 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://jamd-dmaj.vercel.app/api/pro-cron?force=1")
          echo "$response"
          if ! echo "$response" | grep -q '"ok":true'; then
            echo "The Pro server did not confirm a completed cycle."
            exit 1
          fi
