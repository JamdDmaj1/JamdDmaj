name: JamdDmaj Pro Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "1,16,31,46 * * * *"

concurrency:
  group: jamddmaj-pro-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check and recover private scanner
        env:
          CRON_SECRET: ${{ secrets.JAMDDMAJ_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing JAMDDMAJ_CRON_SECRET GitHub secret"
            exit 1
          fi
          curl --fail-with-body --retry 2 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.jamddmaj.com/api/pro-watchdog
