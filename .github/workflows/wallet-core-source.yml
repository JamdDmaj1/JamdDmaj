name: Native multichain SDK source build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wallet-core-source.yml'

permissions:
  contents: read

concurrency:
  group: wallet-core-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-library:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Check out official Wallet Core 4.8.3 source
        uses: actions/checkout@v4
        with:
          repository: trustwallet/wallet-core
          ref: 5031fe6dd14b6d11a5de9892ea4ea1ee443fa13f
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libboost-all-dev ruby-full autoconf automake libtool pkg-config
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12674087" "cmake;3.18.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12674087" >> "$GITHUB_ENV"
          rustup toolchain install nightly-2025-12-11 --profile minimal --component rust-src
          rustup default nightly-2025-12-11
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cbindgen --version 0.29.2 --locked
      - name: Restore native dependency compilation cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/local
            rust/target
            codegen-v2/target
          key: walletcore-5031fe6-ubuntu22-ndk28-rust20251211-boost185-v1
      - name: Build official internal dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/install-dependencies
      - name: Generate Android bindings and native libraries
        run: tools/generate-files android
      - name: Make portable Boost headers visible to the Android compiler
        if: steps.native-cache.outputs.cache-hit != 'true'
        # Ubuntu 22's Boost 1.74 uses std::unary_function removed by the NDK's
        # modern libc++. Use checksum-pinned official portable headers, not host libc.
        run: |
          curl --fail --silent --show-error https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz -o "$RUNNER_TEMP/boost_1_85_0.tar.gz"
          printf '%s  %s\n' 'be0d91732d5b0cc6fbb275c7939974457e79b54d6f07ce2e3dfdd68bef883b0b' "$RUNNER_TEMP/boost_1_85_0.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/boost_1_85_0.tar.gz" -C build/local/include --strip-components=1 boost_1_85_0/boost
      - name: Save completed native dependencies before final Android assembly
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/local
            rust/target
            codegen-v2/target
          key: walletcore-5031fe6-ubuntu22-ndk28-rust20251211-boost185-v1
      - name: Assemble Android library and protobuf classes
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :wallet-core:assembleRelease :wallet-core-proto:jar
      - name: Record artifact provenance
        run: |
          git rev-parse HEAD > build/source-commit.txt
          git diff --stat > build/generated-changes.txt
          sha256sum android/wallet-core/build/outputs/aar/wallet-core-release.aar android/wallet-core-proto/build/libs/*.jar > build/artifact-sha256.txt
          unzip -l android/wallet-core/build/outputs/aar/wallet-core-release.aar
      - uses: actions/upload-artifact@v4
        with:
          name: Wallet-Core-4.8.3-official-source-Android
          path: |
            android/wallet-core/build/outputs/aar/wallet-core-release.aar
            android/wallet-core-proto/build/libs/*.jar
            build/source-commit.txt
            build/artifact-sha256.txt
            build/generated-changes.txt
            LICENSE
          retention-days: 14
          if-no-files-found: error
      # Dependency verification only: no production secrets, signing or blockchain submission.
