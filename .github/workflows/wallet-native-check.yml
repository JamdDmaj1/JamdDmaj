name: Wallet native build-only checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/app/src/debug/java/com/jamddmaj/ai/wallet/**'
      - 'android/app/src/debug/AndroidManifest.xml'
      - 'android/app/build.gradle'
      - 'security/native-tests/**'
      - '.github/workflows/wallet-native-check.yml'
      - 'scripts/check-wallet-lab-manifest.mjs'
permissions:
  contents: read
jobs:
  debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compilation platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check bounded ciphertext format
        run: |
          mkdir -p "$RUNNER_TEMP/wallet-native-tests"
          javac -d "$RUNNER_TEMP/wallet-native-tests" android/app/src/debug/java/com/jamddmaj/ai/wallet/TestVaultEnvelope.java security/native-tests/TestVaultEnvelopeCheck.java
          java -cp "$RUNNER_TEMP/wallet-native-tests" TestVaultEnvelopeCheck
      - name: Build web assets and synchronize
        run: |
          npm ci
          npm test
          npm run mobile:sync
      - name: Build isolated offline diagnostic APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew :app:assembleDebug
      - name: Verify final APK manifest isolation
        run: node scripts/check-wallet-lab-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: JamdDmaj-Wallet-Lab-NO-FUNDS
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      # No release signing secrets, production APK, device installation or money movement.
