name: Wallet native build-only checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/app/src/debug/java/com/jamddmaj/ai/wallet/**'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/**'
      - 'android/app/src/test/java/com/jamddmaj/ai/wallet/**'
      - 'android/app/src/main/java/com/jamddmaj/ai/DevnetWalletPlugin.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/MainActivity.java'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/walletPreview/AndroidManifest.xml'
      - 'native-wallet-entry.js'
      - 'assets-wallet-ui.js'
      - 'android/app/src/debug/AndroidManifest.xml'
      - 'android/app/build.gradle'
      - 'android/wallet-core-vendor/**'
      - 'security/native-tests/**'
      - '.github/workflows/wallet-native-check.yml'
      - 'scripts/check-wallet-lab-manifest.mjs'
      - 'scripts/check-native-wallet-core.mjs'
      - 'scripts/check-production-recovery.mjs'
permissions:
  contents: read
jobs:
  debug-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compilation platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check bounded ciphertext format
        run: |
          mkdir -p "$RUNNER_TEMP/wallet-native-tests"
          javac -d "$RUNNER_TEMP/wallet-native-tests" android/app/src/main/java/com/jamddmaj/ai/wallet/TestVaultEnvelope.java security/native-tests/TestVaultEnvelopeCheck.java
          java -cp "$RUNNER_TEMP/wallet-native-tests" TestVaultEnvelopeCheck
          javac -d "$RUNNER_TEMP/wallet-native-tests" android/app/src/main/java/com/jamddmaj/ai/wallet/WalletNetwork.java security/native-tests/WalletNetworkCheck.java
          java -cp "$RUNNER_TEMP/wallet-native-tests" WalletNetworkCheck
          javac -encoding UTF-8 -d "$RUNNER_TEMP/wallet-native-tests" android/app/src/main/java/com/jamddmaj/ai/wallet/WalletRecoveryProfile.java android/app/src/main/java/com/jamddmaj/ai/wallet/WalletVaultDomain.java android/app/src/main/java/com/jamddmaj/ai/wallet/TestVaultEnvelope.java android/app/src/main/java/com/jamddmaj/ai/wallet/PortableWalletBackup.java android/app/src/main/java/com/jamddmaj/ai/wallet/PortableTestBackup.java security/native-tests/ProductionRecoveryCheck.java
          node scripts/check-production-recovery.mjs java "$RUNNER_TEMP/wallet-native-tests"
      - name: Build web assets and synchronize
        run: |
          npm ci
          npm test
          npm run mobile:sync
      - name: Verify native wallet cryptography and transaction encoding
        run: |
          curl --fail --silent --show-error https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/1.83/bcprov-jdk18on-1.83.jar -o "$RUNNER_TEMP/bcprov.jar"
          javac -cp "$RUNNER_TEMP/bcprov.jar" -d "$RUNNER_TEMP/wallet-native-tests" android/app/src/main/java/com/jamddmaj/ai/wallet/PortableTestBackup.java android/app/src/main/java/com/jamddmaj/ai/wallet/DevnetSolana.java security/native-tests/NativeWalletCoreCheck.java
          node scripts/check-native-wallet-core.mjs java "$RUNNER_TEMP/wallet-native-tests:$RUNNER_TEMP/bcprov.jar"
          javac -cp "$RUNNER_TEMP/bcprov.jar" -d "$RUNNER_TEMP/wallet-native-tests" android/app/src/main/java/com/jamddmaj/ai/wallet/NativeEvmAddress.java security/native-tests/NativeEvmAddressCheck.java
          java -cp "$RUNNER_TEMP/wallet-native-tests:$RUNNER_TEMP/bcprov.jar" NativeEvmAddressCheck
      - name: Build isolated devnet lab APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew :app:assembleDebug :app:assembleRelease :app:assembleWalletPreview
      - name: Native Android storage and RPC failure checks
        working-directory: android
        run: bash gradlew :app:testWalletPreviewUnitTest --tests 'com.jamddmaj.ai.wallet.*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-wallet-failure-test-results
          path: android/app/build/test-results/testWalletPreviewUnitTest/*.xml
          retention-days: 7
      - name: Verify final APK manifest isolation
        run: node scripts/check-wallet-lab-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: JamdDmaj-Wallet-Lab-DEVNET-ONLY
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: JamdDmaj-Integrated-Wallet-Preview-DEVNET-ONLY
          path: android/app/build/outputs/apk/walletPreview/*.apk
          retention-days: 7
      # No release signing secrets, production APK, device installation or money movement.
