name: Offline Android wallet SDK verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'security/native-sdk-check/**'
      - 'android/wallet-core-vendor/**'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/NativeHdWallet.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/NativeBnbSigner.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/BnbSignedTransaction.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/NativeEvmAddress.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/WalletStorageBarrier.java'
      - 'android/app/src/main/java/com/jamddmaj/ai/wallet/WalletRecoveryProfile.java'
      - '.github/workflows/wallet-sdk-verify.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify exact source and binary before use
        run: |
          echo 'eec5addbada174fd3946b29d237b18bdc049ea82c5b1196181079d9504df42a4  android/wallet-core-vendor/wallet-core-4.8.3.aar' | sha256sum -c -
          echo '57523cffc7c87bc6a82b3395e9b871030a08e77e9efc3e19c67a4ffe36691ac2  android/wallet-core-vendor/wallet-core-proto-4.8.3.jar' | sha256sum -c -
          mkdir -p security/native-sdk-check/libs
          cp android/wallet-core-vendor/wallet-core-4.8.3.aar security/native-sdk-check/libs/wallet-core-release.aar
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash android/gradlew -p security/native-sdk-check connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Offline-wallet-SDK-test-results
          path: security/native-sdk-check/build/outputs/androidTest-results/
          retention-days: 14
      # No production signing credentials, user keys, RPC calls or app deployment.
