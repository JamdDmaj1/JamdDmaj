name: Offline Android wallet SDK verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'security/native-sdk-check/**'
      - '.github/workflows/wallet-sdk-verify.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36195922802
          name: Wallet-Core-4.8.3-official-source-Android
          path: sdk-artifact
      - name: Verify exact source and binary before use
        run: |
          test "$(cat sdk-artifact/build/source-commit.txt)" = '5031fe6dd14b6d11a5de9892ea4ea1ee443fa13f'
          echo 'eec5addbada174fd3946b29d237b18bdc049ea82c5b1196181079d9504df42a4  sdk-artifact/android/wallet-core/build/outputs/aar/wallet-core-release.aar' | sha256sum -c -
          mkdir -p security/native-sdk-check/libs
          cp sdk-artifact/android/wallet-core/build/outputs/aar/wallet-core-release.aar security/native-sdk-check/libs/
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash android/gradlew -p security/native-sdk-check connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Offline-wallet-SDK-test-results
          path: security/native-sdk-check/build/outputs/androidTest-results/
          retention-days: 14
      # No production signing credentials, user keys, RPC calls or app deployment.
