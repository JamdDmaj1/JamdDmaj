apply plugin: 'com.android.application'

def releaseKeystoreFile = System.getenv("JAMDDMAJ_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("JAMDDMAJ_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("JAMDDMAJ_KEY_ALIAS")
def releaseKeyPassword = System.getenv("JAMDDMAJ_KEY_PASSWORD")
def releaseSigningReady = releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.jamddmaj.ai"
    compileSdk = rootProject.ext.compileSdkVersion
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED', '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED', '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
    defaultConfig {
        applicationId "com.jamddmaj.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 134
        versionName "1.37.78"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Separate devnet app; never replaces the production or offline diagnostic app.
            applicationIdSuffix ".walletlab.devnet"
            versionNameSuffix "-walletlab-devnet"
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        walletPreview {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix ".walletpreview"
            versionNameSuffix "-walletpreview"
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation files('../wallet-core-vendor/wallet-core-4.8.3.aar')
    implementation files('../wallet-core-vendor/wallet-core-proto-4.8.3.jar')
    implementation 'com.google.protobuf:protobuf-javalite:3.22.3'
    implementation "org.bouncycastle:bcprov-jdk18on:1.83"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Fail closed if the verified source-build artifact is replaced or corrupted.
def walletCoreBinary = file('../wallet-core-vendor/wallet-core-4.8.3.aar')
def walletCoreDigest = java.security.MessageDigest.getInstance('SHA-256').digest(walletCoreBinary.bytes).encodeHex().toString()
if (walletCoreDigest != 'eec5addbada174fd3946b29d237b18bdc049ea82c5b1196181079d9504df42a4') {
    throw new GradleException('Wallet Core binary checksum mismatch')
}
if (java.security.MessageDigest.getInstance('SHA-256').digest(file('../wallet-core-vendor/wallet-core-proto-4.8.3.jar').bytes).encodeHex().toString() != '57523cffc7c87bc6a82b3395e9b871030a08e77e9efc3e19c67a4ffe36691ac2') {
    throw new GradleException('Wallet Core protobuf checksum mismatch')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
