<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Google sign-in - JamdDmaj AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background:
        radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.22), transparent 28rem),
        radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.16), transparent 26rem),
        #090b10;
      color: #f5f7fb;
      font-family: Inter, system-ui, sans-serif;
    }
    main {
      width: min(430px, 100%);
      padding: 30px 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      background: rgba(18, 21, 30, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }
    .brand {
      margin-bottom: 22px;
      color: #22d3ee;
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: 1.65rem; }
    p { margin: 0 0 22px; color: #a6adbd; line-height: 1.55; }
    button {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.62; }
    #status { min-height: 24px; margin-top: 16px; font-size: 0.85rem; }
    #status.error { color: #fb7185; }
    .privacy { margin: 20px 0 0; font-size: 0.72rem; }
  </style>
</head>
<body>
  <main>
    <div class="brand">JamdDmaj AI</div>
    <h1>Continue with Google</h1>
    <p>Sign in securely in your browser. You will return to the JamdDmaj app automatically.</p>
    <button id="googleBtn" type="button" disabled>Preparing Google...</button>
    <p id="status" aria-live="polite"></p>
    <p class="privacy">Your Google password is never shared with JamdDmaj.</p>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const state = params.get("state") || "";
      const challenge = params.get("challenge") || "";
      const button = document.getElementById("googleBtn");
      const status = document.getElementById("status");
      let tokenClient = null;

      function setStatus(message, error = false) {
        status.textContent = message;
        status.classList.toggle("error", error);
      }

      function valid(value, minimum, maximum) {
        return value.length >= minimum && value.length <= maximum && /^[A-Za-z0-9_-]+$/.test(value);
      }

      function returnToApp(ticket) {
        location.href = `jamddmaj://google?ticket=${encodeURIComponent(ticket)}&state=${encodeURIComponent(state)}`;
      }

      async function completeGoogleSignIn(accessToken) {
        setStatus("Securing your sign-in...");
        const response = await fetch("/api/account", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "googleMobileStart",
            accessToken,
            state,
            challenge
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ticket) {
          throw new Error(data?.error?.message || "Google sign-in could not be prepared.");
        }
        button.textContent = "Return to JamdDmaj AI";
        button.disabled = false;
        button.onclick = () => returnToApp(data.ticket);
        setStatus("Google verified. Returning to the app...");
        returnToApp(data.ticket);
      }

      async function initialize() {
        if (!valid(state, 16, 128) || !valid(challenge, 32, 128)) {
          throw new Error("This mobile sign-in request is not valid. Start again from JamdDmaj AI.");
        }
        const response = await fetch(`/api/account?t=${Date.now()}`, { cache: "no-store" });
        const config = await response.json().catch(() => ({}));
        if (!response.ok || !config?.google?.enabled || !config.google.clientId) {
          throw new Error("Google sign-in is not configured for JamdDmaj yet.");
        }
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://accounts.google.com/gsi/client";
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Google Identity could not load."));
          document.head.append(script);
        });
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: config.google.clientId,
          scope: "openid email profile",
          callback: (result) => {
            if (!result?.access_token) {
              setStatus("Google did not return access. Please try again.", true);
              button.disabled = false;
              return;
            }
            completeGoogleSignIn(result.access_token).catch((error) => {
              setStatus(error.message, true);
              button.disabled = false;
            });
          },
          error_callback: () => {
            setStatus("Google sign-in was cancelled.", true);
            button.disabled = false;
          }
        });
        button.textContent = "Continue with Google";
        button.disabled = false;
        button.onclick = () => {
          button.disabled = true;
          setStatus("Opening Google...");
          tokenClient.requestAccessToken({ prompt: "select_account" });
        };
      }

      initialize().catch((error) => {
        button.textContent = "Return to JamdDmaj AI";
        button.disabled = false;
        button.onclick = () => location.href = "jamddmaj://google";
        setStatus(error.message, true);
      });
    })();
  </script>
</body>
</html>
