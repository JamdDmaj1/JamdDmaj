[package]
name = "jamddmaj-lock"
version = "0.1.0"
description = "Devnet-only JamdDmaj protected launch vesting and liquidity lock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jamddmaj_lock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
