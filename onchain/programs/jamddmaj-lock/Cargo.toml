[package]
name = "jamddmaj-lock"
version = "0.1.0"
description = "Devnet-only JamdDmaj protected launch vesting and liquidity lock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jamddmaj_lock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
# Solana 2.1.0's sBPF toolchain uses Cargo 1.79. Newer blake3 releases
# select edition-2024-only cpufeatures 0.3, so keep the newest compatible line.
blake3 = "=1.5.5"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"
proc-macro-crate = "=3.3.0"
