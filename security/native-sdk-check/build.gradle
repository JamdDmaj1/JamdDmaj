plugins { id 'com.android.application' version '8.13.0' }
android {
    namespace 'com.jamddmaj.sdkcheck'
    compileSdk 36
    sourceSets.main.java.srcDir layout.buildDirectory.dir('verified-adapter-source')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.jamddmaj.sdkcheck'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName 'verification-only'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}
// Android's source provider does not reliably honor SourceDirectorySet includes.
// Copy only these two production classes; never implicitly compile the WebView app.
tasks.register('copyVerifiedAdapter', Sync) {
    from('../../android/app/src/main/java') {
        include 'com/jamddmaj/ai/wallet/NativeHdWallet.java'
        include 'com/jamddmaj/ai/wallet/WalletRecoveryProfile.java'
        include 'com/jamddmaj/ai/wallet/NativeBnbSigner.java'
        include 'com/jamddmaj/ai/wallet/BnbSignedTransaction.java'
        include 'com/jamddmaj/ai/wallet/NativeEvmAddress.java'
    }
    into layout.buildDirectory.dir('verified-adapter-source')
}
tasks.named('preBuild').configure { dependsOn 'copyVerifiedAdapter' }
dependencies {
    implementation files('libs/wallet-core-release.aar')
    implementation files('../../android/wallet-core-vendor/wallet-core-proto-4.8.3.jar')
    implementation 'com.google.protobuf:protobuf-javalite:3.22.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'org.bouncycastle:bcprov-jdk18on:1.83'
}
